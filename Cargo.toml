[package]
name = "hr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unified HTTP response envelope (code/message/data) for axum services"
keywords = ["axum", "http", "response", "json"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
